version: 2
models:
  - name: stg_product_transactions
    columns:
      - name: transaction_id
        data_tests: [not_null, unique]
  - name: stg_ledger_entries
    columns:
      - name: transaction_id
        data_tests: [not_null, unique]
  - name: fct_reconciliation_exceptions
    columns:
      - name: transaction_id
        data_tests: [not_null, unique]
      - name: reconciliation_status
        data_tests:
          - accepted_values:
              values: ['product_only', 'ledger_only', 'currency_mismatch', 'amount_mismatch']
